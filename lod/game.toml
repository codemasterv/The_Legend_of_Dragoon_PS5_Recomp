# Widescreen (PS5: ps5_controls.ini widescreen = on). The engine state word
# (Severed Chains: engineState_8004dd20) picks the scenes that widen:
# 5 = field/town, 6 = battle, 8 = world map. Fields widen by sliding the view
# inside the room's pre-rendered art (view_anchor below); rooms narrower than
# the screen get side bars. FMVs and menus stay 4:3.
[widescreen]
# Black side margins when no 3D is drawn (battle-entry melt, menus).
blank_margins_without_3d = true
# Movies show only what the movie decoder wrote (no leftover-VRAM junk).
fmv_hide_unwritten = true
gameplay_state_addr = "0x8004DD20"
gameplay_state_values = ["0x5", "0x6", "0x8"]
gte_game_mode = true
[widescreen.view_anchor]
# fields: the wide view slides inside the room (camera = screenOffset.x,
# limits = the submap scroll clamp); narrow rooms get black side bars
camera = "0x800CB568"
min = "0x800CB574"
max = "0x800CB570"
negate = true
states = ["0x5"]
[widescreen.cull]
# world map (0x800C9...) and field models (0x800DA...-0x800EE...):
# screen X kept in [-192, 192] around the centre
