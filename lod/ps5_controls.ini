# PS5 controls for this game. Edit, then restart the game.
# sticks and D-pad move the cursor too; stick_speed scales the sticks.
stick_speed = 1.0

# touch_pointer: where your finger is on the touchpad is where the
# cursor goes on screen; clicking the touchpad clicks there.
touch_pointer = on

# usb_mouse: a USB or Bluetooth mouse moves the cursor and clicks;
# usb_mouse_speed scales it (0.5 = half as fast).
usb_mouse = on
usb_mouse_speed = 1.0

# shortcut_button: the button held for the shortcuts (L1/R1 disc,
# Square/Triangle save/load state, L3 FPS). auto = Options in mouse
# games, touchpad click in controller games; or options / touchpad.
shortcut_button = auto

#Fields and towns: these stay 4:3 with side bars, 
#because their background art only exists at 4:3. 
#FMVs and menus stay 4:3 as well.
renderer = vulkan
widescreen = on
resolution = 4
cpu_overclock = off

#Settings are off, on (the default) and 2, this is ignored when vulkan is on
antialiasing = 2

# perspective_textures = on helps prevent wobble of objects
perspective_textures = on
hd_textures = on
fmv_hide_unwritten = true
blank_margins_without_3d = true
fmv_fill = on

#Settings are Left (the default) and Right for message location
messages = left